---
# ===========================================================================
# Provisionamento pos-boot do CAIS-Interno Server PRD
#
#   1. common       -> atualiza pacotes do SO
#   2. data_volume  -> LVM (PV/VG data_vg/LV data_lv) sobre o disco de 20GB,
#                      monta em /data por UUID (via fstab, com backup), cria a
#                      estrutura de diretorios (/data/apps/farol-front-prod,
#                       farol-back-prod, proxy, pmo-front-prod, pmo-back-prod,
#                       /data/docker, /data/containerd). Ampliavel: basta somar
#                      discos ao VG.
#   3. docker       -> instala Docker + Compose, move o data-root do Docker
#                      (/data/docker) E o root do containerd (/data/containerd)
#                      para o disco de dados, habilita no boot e adiciona o
#                      usuario ubuntu ao grupo docker
#   4. aws_cli      -> AWS CLI v2 + credenciais + ECR credential helper
#                      (push/pull de imagens no ECR sem docker login manual)
#
# Uso:
#   ansible-galaxy collection install -r requirements.yml
#   cp group_vars/cais_interno_prod/secrets.yml.example group_vars/cais_interno_prod/secrets.yml  # e preencher
#   ansible-playbook site.yml
# ===========================================================================
- name: Provisionar CAIS-Interno Server PRD
  hosts: cais_interno_prod
  become: true
  gather_facts: true

  roles:
    - role: common
      tags: [common, update]

    - role: data_volume
      tags: [disk, data_volume]

    - role: docker
      tags: [docker]

    - role: aws_cli
      tags: [aws, ecr]
