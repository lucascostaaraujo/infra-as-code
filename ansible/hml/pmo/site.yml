---
# ===========================================================================
# Provisionamento pos-boot do PMO Server HML
#
#   1. common       -> atualiza pacotes do SO
#   2. data_volume  -> formata / monta o disco de 10GB em /data (via UUID no
#                      fstab), backup do fstab e estrutura de diretorios
#                      (/data/apps/cais-pmo-back-homol, cais-pmo-front-homol,
#                       proxy, docker)
#   3. docker       -> instala Docker + Compose, move o data-root para /data,
#                      habilita no boot e adiciona o usuario ubuntu ao grupo
#   4. aws_cli      -> AWS CLI v2 + credenciais + ECR credential helper
#                      (push/pull de imagens no ECR sem docker login manual)
#
# Uso:
#   ansible-galaxy collection install -r requirements.yml
#   cp group_vars/pmo_hml/secrets.yml.example group_vars/pmo_hml/secrets.yml  # e preencher
#   ansible-playbook site.yml
# ===========================================================================
- name: Provisionar PMO Server HML
  hosts: pmo_hml
  become: true
  gather_facts: true

  roles:
    - role: common
      tags: [common, update]

    - role: data_volume
      tags: [disk, data_volume]

    - role: docker
      tags: [docker]

    - role: aws_cli
      tags: [aws, ecr]
